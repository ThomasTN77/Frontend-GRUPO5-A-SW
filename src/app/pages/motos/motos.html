<header class="crud-barra">
  <h2>Motos</h2>

  <form class="filtro" (submit)="$event.preventDefault(); buscarPorId()">
    <input
      [(ngModel)]="idFiltro"
      name="idFiltro"
      placeholder="Filtrar por ID (UUID)"
      autocomplete="off"
    />
    <button type="submit" [disabled]="cargando()">Buscar</button>
    <button type="button" class="secundario" (click)="limpiarFiltro()" [disabled]="cargando()">
      Todos
    </button>
  </form>

  <button type="button" (click)="abrirCrear()">+ Crear</button>
</header>

@if (mensaje()) {
  <p class="mensaje" [class.error]="esError()">{{ mensaje() }}</p>
}

<table>
  <thead>
    <tr>
      <th>ID</th>
      <th>Marca</th>
      <th>Modelo</th>
      <th>Cilindraje</th>
      <th>Año</th>
      <th>Acciones</th>
    </tr>
  </thead>
  <tbody>
    @for (fila of filas(); track fila.id) {
      <tr>
        <td class="id">{{ fila.id }}</td>
        <td>{{ fila.marca }}</td>
        <td>{{ fila.modelo }}</td>
        <td>{{ fila.cilindraje }} cc</td>
        <td>{{ fila.anio }}</td>
        <td class="acciones">
          <button type="button" (click)="abrirEditar(fila)">Editar</button>
          <button type="button" class="peligro" (click)="eliminar(fila)">Eliminar</button>
        </td>
      </tr>
    }
  </tbody>
</table>

@if (popupAbierto()) {
  <div class="fondo-popup" (click)="cerrarPopup()">
    <form class="popup" (click)="$event.stopPropagation()" (ngSubmit)="guardar()">
      <h3>{{ modo() === 'crear' ? 'Crear moto' : 'Editar moto' }}</h3>

      <label class="campo">
        <span>Marca</span>
        <input [(ngModel)]="formulario.marca" name="marca" required placeholder="Ej: Honda" />
      </label>
      <label class="campo">
        <span>Modelo</span>
        <input [(ngModel)]="formulario.modelo" name="modelo" required placeholder="Ej: CB 190R" />
      </label>
      <label class="campo">
        <span>Cilindraje (cc)</span>
        <input [(ngModel)]="formulario.cilindraje" name="cilindraje" type="number" min="1" max="3000" required />
      </label>
      <label class="campo">
        <span>Año</span>
        <input [(ngModel)]="formulario.anio" name="anio" type="number" min="1900" max="2100" required />
      </label>

      <div class="popup-acciones">
        <button type="button" class="secundario" (click)="cerrarPopup()">Cancelar</button>
        <button type="submit" [disabled]="cargando()">Guardar</button>
      </div>
    </form>
  </div>
}
